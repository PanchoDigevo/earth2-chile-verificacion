name: escenarios
# Escenarios de peligro meteorológico de incendio a 15 días con AIFS-ENS (50 miembros). Diario.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"
  push:
    branches: [main]
    paths: ["escenarios/**", ".github/workflows/escenarios.yml"]
permissions:
  contents: write
  actions: write
concurrency:
  group: escenarios
  cancel-in-progress: false
jobs:
  escenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r escenarios/requirements.txt pandas
      - name: Escenarios AIFS-ENS
        run: python escenarios/escenarios.py
      - name: Guardar
        run: |
          git config user.name "earth2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add escenarios/data site/escenarios.html
          git diff --cached --quiet || git commit -m "escenarios: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publicar el sitio
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verificacion.yml --ref main
