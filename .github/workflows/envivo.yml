name: envivo
# Pestaña "En vivo": actualiza rayos GOES-19 y METAR cada 5 minutos y los guarda en la rama datos-en-vivo
# (un solo commit que se reemplaza, para no llenar el historial de main). La página los lee desde raw.githubusercontent.com.
# GitHub omite a menudo los cron frecuentes, así que cada corrida da vueltas durante casi 6 horas. El cron solo deja una
# corrida en espera, que parte cuando termina la anterior (concurrency sin cancelar).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Cuánto rato dar vueltas (minutos; 0 = una sola actualización)"
        default: "340"
permissions:
  contents: write
concurrency:
  group: envivo
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install netCDF4 numpy shapely
      - name: Traer los datos anteriores (si existen)
        run: |
          mkdir -p datos/envivo
          if git ls-remote --exit-code --heads origin datos-en-vivo >/dev/null; then
            git fetch -q origin datos-en-vivo
            git show origin/datos-en-vivo:envivo/rayos.json > datos/envivo/rayos.json 2>/dev/null || true
            git show origin/datos-en-vivo:envivo/lluvia.json > datos/envivo/lluvia.json 2>/dev/null || rm -f datos/envivo/lluvia.json
            git show origin/datos-en-vivo:envivo/tormentas.json > datos/envivo/tormentas.json 2>/dev/null || rm -f datos/envivo/tormentas.json
          fi
      - name: Actualizar rayos y METAR cada 5 minutos
        env:
          MINUTOS: ${{ inputs.minutos || '340' }}
          DESTINO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          fin=$(( $(date +%s) + MINUTOS * 60 ))
          while :; do
            python envivo/actualizar.py --salida datos/envivo || echo "::warning::falló esta vuelta; se reintenta en 5 minutos"
            ( cd datos && rm -rf .git && git init -q -b datos-en-vivo \
              && git config user.name "earth2-bot" && git config user.email "actions@users.noreply.github.com" \
              && printf 'Datos de la pestaña En vivo (rayos GOES-19 y METAR), actualizados cada 5 minutos por envivo.yml.\nEsta rama se reemplaza en cada actualización.\n' > LEEME.md \
              && git add -A && git commit -q -m "en vivo: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "$DESTINO" datos-en-vivo ) \
              || echo "::warning::no se pudo guardar esta vuelta"
            [ "$(date +%s)" -ge "$fin" ] && break
            sleep 300
          done
