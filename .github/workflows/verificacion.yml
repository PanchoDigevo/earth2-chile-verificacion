name: verificacion-diaria
on:
  schedule:
    - cron: "30 2,8,14,20 * * *"   # ~8 h después de cada corrida (00/06/12/18 UTC): AIFS, IFS y GFS ya están completas
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: verificacion
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r verificacion/requirements.txt
      - name: Observaciones METAR
        working-directory: verificacion
        run: python fetch_metar.py
      # Cada modelo baja su última corrida completa. Si uno falla, los otros se verifican igual.
      - name: Última corrida AIFS (ECMWF, IA)
        working-directory: verificacion
        continue-on-error: true
        run: python fetch_aifs.py
      - name: Última corrida IFS (ECMWF, físico)
        working-directory: verificacion
        continue-on-error: true
        run: python fetch_ifs.py
      - name: Última corrida GFS (NOAA, físico)
        working-directory: verificacion
        continue-on-error: true
        run: python fetch_gfs.py
      - name: Verificar y generar sitio
        working-directory: verificacion
        run: python verify.py
      - name: Guardar observaciones y resultados
        run: |
          git config user.name "earth2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add verificacion/data site
          git diff --cached --quiet || git commit -m "verificación $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
